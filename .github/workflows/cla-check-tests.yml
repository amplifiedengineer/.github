# SPDX-License-Identifier: Apache-2.0
name: cla-check-tests

# Runs the offline tests for scripts/cla-check.sh, the script behind the CLA and
# DCO checks. The tests build throwaway git repositories and need no network.
on:
  pull_request:
    paths:
      - scripts/cla-check.sh
      - scripts/cla-check.test.sh
      - .github/workflows/cla-check-tests.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cla-check-tests:
    name: cla-check-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the script
        run: shellcheck scripts/cla-check.sh scripts/cla-check.test.sh
      - name: Run the tests
        run: bash scripts/cla-check.test.sh
