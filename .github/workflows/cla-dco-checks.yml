# SPDX-License-Identifier: Apache-2.0
name: CLA & DCO checks (reusable)

# The DCO and CLA checks for a pull request. A contributor signs the CLA by
# adding a row to the signatures file in a commit of their own, so the record
# lives in git history and moves with the repository to any host. The steps for
# a contributor are in .github/CONTRIBUTING-RULES.md.
#
# SAFETY: runs on plain pull_request with read-only permissions and no
# secrets. The checkout drops its credentials. The script reads git objects and
# one list of commits from the REST API. No value from the pull request reaches
# a script through an expression: every one goes through `env`.
#
# A caller names its job `cla-dco`, so the required checks read
# `cla-dco / dco` and `cla-dco / cla-check`. To reuse this in another repo,
# copy the workflow and scripts/cla-check.sh, or call it by commit from the
# organization's .github repository and set `tooling-ref` to that same commit,
# so the script is fetched at a pinned revision and not read from the pull
# request.
on:
  workflow_call:
    inputs:
      signatures-file:
        description: Path of the signatures file, relative to the repository root.
        type: string
        default: .github/CONTRIBUTORS.md
      cla-path:
        description: Path of the CLA text, shown in the failure message.
        type: string
        default: .github/ICLA.md
      statement:
        description: Sentence a signing commit message must contain.
        type: string
        default: I have read the CLA Document and I hereby sign the CLA.
      extra-bots:
        description: Extra bot logins or emails to skip, comma separated.
        type: string
        default: ""
      ignored-coauthors:
        description: Comma separated patterns for AI and bot co-authors to ignore. Empty uses the list built into the script (documented in the CLA and DCO notes). A pattern with @ or [ is a substring of the email or name; any other is a whole word in the name or email.
        type: string
        default: ""
      extra-ignored-coauthors:
        description: Patterns added to the ignore list in use.
        type: string
        default: ""
      script:
        description: Path of the check script, relative to the caller repository, or to the tooling repository when tooling-ref is set.
        type: string
        default: scripts/cla-check.sh
      tooling-repository:
        description: Repository that holds the check script when tooling-ref is set.
        type: string
        default: pragmatic-engineer/.github
      tooling-ref:
        description: Full commit SHA of the tooling repository. When set, the script is fetched from there at that commit instead of being read from the caller repository.
        type: string
        default: ""

permissions: {}

jobs:
  # Job keys are unique across the workflow set so check-run names stay
  # unambiguous.
  dco:
    name: dco
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    # timeout-minutes: max(5, 3x slowest success seen); a hung job fails fast.
    timeout-minutes: 5
    permissions:
      contents: read # fetch the pull request commits
      pull-requests: read # list the commits with their account logins
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tooling pin
        if: inputs.tooling-ref != ''
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
        run: |
          case "$TOOLING_REF" in
            *[!0-9a-f]*) echo "tooling-ref must be a full lowercase commit SHA" >&2; exit 1 ;;
          esac
          if [ "${#TOOLING_REF}" -ne 40 ]; then
            echo "tooling-ref must be a full lowercase commit SHA" >&2
            exit 1
          fi
      - name: Fetch the pinned tooling
        if: inputs.tooling-ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tooling-repository }}
          ref: ${{ inputs.tooling-ref }}
          path: .cla-tooling
          persist-credentials: false
      - name: List commit accounts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | [.sha, (.author.login // ""), (.author.type // ""), (.committer.login // ""), (.committer.type // "")] | @tsv' \
            >"$RUNNER_TEMP/commit-accounts.tsv"
      - name: Check DCO (Signed-off-by on every commit)
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCRIPT: ${{ inputs.tooling-ref != '' && format('.cla-tooling/{0}', inputs.script) || inputs.script }}
          EXTRA_BOTS: ${{ inputs.extra-bots }}
        run: |
          bash "$SCRIPT" dco \
            --base "origin/$BASE_BRANCH" --head "$HEAD_SHA" \
            --logins "$RUNNER_TEMP/commit-accounts.tsv" \
            --bots "$EXTRA_BOTS" | tee -a "$GITHUB_STEP_SUMMARY"

  cla-check:
    name: cla-check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # fetch the pull request commits
      pull-requests: read # list the commits with their account logins
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tooling pin
        if: inputs.tooling-ref != ''
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
        run: |
          case "$TOOLING_REF" in
            *[!0-9a-f]*) echo "tooling-ref must be a full lowercase commit SHA" >&2; exit 1 ;;
          esac
          if [ "${#TOOLING_REF}" -ne 40 ]; then
            echo "tooling-ref must be a full lowercase commit SHA" >&2
            exit 1
          fi
      - name: Fetch the pinned tooling
        if: inputs.tooling-ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tooling-repository }}
          ref: ${{ inputs.tooling-ref }}
          path: .cla-tooling
          persist-credentials: false
      - name: List commit accounts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | [.sha, (.author.login // ""), (.author.type // ""), (.committer.login // ""), (.committer.type // "")] | @tsv' \
            >"$RUNNER_TEMP/commit-accounts.tsv"
      - name: Check CLA (default branch list plus this pull request)
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CLA_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/${{ inputs.cla-path }}
          SIGNATURES_FILE: ${{ inputs.signatures-file }}
          STATEMENT: ${{ inputs.statement }}
          IGNORED_COAUTHORS: ${{ inputs.ignored-coauthors }}
          EXTRA_IGNORED_COAUTHORS: ${{ inputs.extra-ignored-coauthors }}
          SCRIPT: ${{ inputs.tooling-ref != '' && format('.cla-tooling/{0}', inputs.script) || inputs.script }}
          EXTRA_BOTS: ${{ inputs.extra-bots }}
        run: |
          bash "$SCRIPT" cla \
            --base "origin/$BASE_BRANCH" --head "$HEAD_SHA" \
            --file "$SIGNATURES_FILE" --pr-author "$PR_AUTHOR" \
            --logins "$RUNNER_TEMP/commit-accounts.tsv" \
            --bots "$EXTRA_BOTS" --statement "$STATEMENT" \
            --ignored-coauthors "$IGNORED_COAUTHORS" \
            --extra-ignored-coauthors "$EXTRA_IGNORED_COAUTHORS" \
            --cla-url "$CLA_URL" | tee -a "$GITHUB_STEP_SUMMARY"
