# SPDX-License-Identifier: Apache-2.0
name: CLA & DCO

# Calls the checks in cla-dco-checks.yml. A contributor signs the CLA by adding
# a row to .github/CONTRIBUTORS.md in a commit of their own, so this workflow
# needs no comment trigger, no write permission and no secret. The job id must
# stay `cla-dco` so the required checks read `cla-dco / dco` and
# `cla-dco / cla-check`.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cla-dco:
    name: cla-dco
    permissions:
      contents: read # the called jobs fetch the pull request commits
      pull-requests: read # the called jobs list the commits with their logins
    uses: $/.github/workflows/cla-dco-checks.yml
