# SPDX-License-Identifier: Apache-2.0
name: CLA signing (reusable)

# Records a CLA signature when a contributor comments the signing sentence on a
# pull request. Signatures are written to the `cla-signatures` branch, not the
# default branch, because the default branch ruleset requires a pull request and
# the Actions app cannot bypass it. The branch is created from the default branch
# on the first signature and is not covered by any ruleset. It is a separate
# workflow so pull request runs of the checks keep read-only permissions. Every
# untrusted value (comment body, login) reaches the script through `env`,
# never through an expression inside the script.
on:
  workflow_call:

permissions: {}

jobs:
  cla-sign:
    if: >
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: cla-signature-${{ github.event.comment.user.login }}
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Record CLA signature
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SIGNER: ${{ github.event.comment.user.login }}
          SIGNER_TYPE: ${{ github.event.comment.user.type }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const author = process.env.SIGNER;
            if (process.env.SIGNER_TYPE === 'Bot') {
              core.info('Bots cannot sign the CLA.');
              return;
            }
            const baseBranch = process.env.BASE_BRANCH;
            const branch = 'cla-signatures';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const filePath = '.github/CONTRIBUTORS.md';
            const date = new Date().toISOString().split('T')[0];
            const newRow = '| @' + author + ' | ' + date + ' |';
            const maxRetries = 3;

            // Create the signature branch from the default branch when missing.
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
            } catch (err) {
              if (err.status !== 404) throw err;
              const { data: base } = await github.rest.repos.getBranch({ owner, repo, branch: baseBranch });
              try {
                await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/' + branch, sha: base.commit.sha });
                core.info('Created branch ' + branch + ' from ' + baseBranch + '.');
              } catch (e) {
                // A parallel run created it first.
                if (e.status !== 422) throw e;
              }
            }

            const getFile = async (ref) => {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: filePath, ref });
                return data;
              } catch (err) {
                if (err.status === 404) return null;
                throw err;
              }
            };

            for (let attempt = 1; attempt <= maxRetries; attempt++) {
              try {
                // Prefer the signature branch. Fall back to the seed on the
                // default branch when the file is not on the signature branch yet.
                let file = await getFile(branch);
                const seeded = file === null;
                if (seeded) file = await getFile(baseBranch);
                if (file === null) {
                  core.setFailed(filePath + ' is missing on ' + baseBranch + '. Add it in a separate pull request first.');
                  return;
                }

                const content = Buffer.from(file.content, 'base64').toString('utf-8');

                if (content.toLowerCase().split('\n').some(l => /^\|\s*@([^\s|]+)\s*\|/.exec(l.trim())?.[1] === author.toLowerCase())) {
                  core.info('@' + author + ' already signed (detected on attempt ' + attempt + ').');
                  break;
                }

                const updated = content.replace(
                  '<!-- CLA-BOT:END',
                  newRow + '\n<!-- CLA-BOT:END',
                );

                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: filePath,
                  message: 'chore: record CLA signature for @' + author + ' [skip ci]',
                  content: Buffer.from(updated).toString('base64'),
                  sha: seeded ? undefined : file.sha,
                  branch,
                  committer: {
                    name: 'github-actions[bot]',
                    email: '41898282+github-actions[bot]@users.noreply.github.com',
                  },
                });

                core.info('CLA signature recorded for @' + author + ' on attempt ' + attempt + '.');

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: Number(process.env.ISSUE_NUMBER),
                  body: 'Thank you @' + author + '! Your CLA signature has been recorded in [CONTRIBUTORS.md](https://github.com/' + owner + '/' + repo + '/blob/' + branch + '/' + filePath + '). Push a new commit to this PR, or ask a maintainer to re-run the `cla-check` job, to refresh its status.',
                });

                break;
              } catch (err) {
                if (err.status === 409 && attempt < maxRetries) {
                  core.warning('Conflict on attempt ' + attempt + ', retrying...');
                  await new Promise(r => setTimeout(r, 1000 * attempt));
                  continue;
                }
                throw err;
              }
            }
